name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov mpmath flake8 black isort mypy
    - name: Run test suite with coverage
      run: |
        pytest --cov=src --cov-report=term-missing tests/
    - name: Run benchmarks
      run: |
        python experiments/run_benchmarks.py
    - name: Run symbolic verification
      run: |
        python experiments/symbolic_order.py
    - name: Lint with flake8
      run: |
        flake8 src tests experiments
    - name: Check format with black
      run: |
        black --check src tests experiments
    - name: Check imports with isort
      run: |
        isort --check-only src tests experiments
    - name: Type check with mypy
      run: |
        mypy src tests experiments
